apply plugin: 'com.android.application'

android {
    namespace = 'com.github.axet.bookreader2'
    compileSdkVersion = 35
    buildToolsVersion = "36.1.0"
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    buildFeatures {
        buildConfig = true
    }
    
    defaultConfig {
        applicationId = "com.github.axet.bookreader2"
        minSdkVersion = 24
        targetSdkVersion = 35
        versionCode = 420
        versionName = "3.0.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
    signingConfigs {
        release {
            storeFile = file(project.findProperty('RELEASE_STORE_FILE') ?: 'none')
            storePassword = project.findProperty('RELEASE_STORE_PASSWORD')
            keyAlias = project.findProperty('RELEASE_KEY_ALIAS')
            keyPassword = project.findProperty('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set(
                    org.apache.commons.io.FilenameUtils.getExtension(android.defaultConfig.applicationId) + "-" + 
                    (output.filters.find { it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI }?.identifier ?: "universal") + "-" + 
                    android.defaultConfig.versionName + "-" + variant.buildType + ".apk"
                )
            }
        }
    }
    bundle {
        abi {
            enableSplit = true
        }
    }
}

configurations { // TODO fix library dependency copy
        resolvableImpl.extendsFrom(implementation)
        resolvableImpl.canBeResolved = true
        
        // Fix Kotlin stdlib conflicts
        all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            exclude group: 'com.android.support', module: 'support-v4'
            exclude group: 'com.android.support'
        }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    implementation 'com.github.axet:android-library:1.41.0-androidx-sdk35'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation ('com.github.axet.fbreader:library:0.1.20-sdk35-androidx') { 
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'junit', module: 'junit'
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }
    implementation 'com.github.axet:djvulibre:0.1.5-sdk35-16kb'  // Updated with 16 KB support
    implementation 'io.github.oothp:pdfium-android:1.9.5-beta01'  // 16 KB compatible fork
    implementation 'com.github.axet:k2pdfopt:0.1.7-sdk35-16kb'
    implementation ('com.github.axet:wget:1.7.0') { exclude group: 'org.json', module: 'json' }
}
